[project]
name = "Bridge"
version = "0.0.1"
description = "A Bridge simulator for learning/playing"
readme = "README.md"
authors = [{ name = "Brian Larsen", email = "balarsen@gmail.com" }]
license = "BSD-3-Clause"
license-files = ["License.txt"]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=2.0",
    "numba>=0.68",
]

[project.urls]
"Bug Tracker" = "https://github.com/balarsen/Bridge/issues"
Homepage = "https://github.com/balarsen/Bridge"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
]
dd = [
    # the double-dummy solver (DDS); the package has wheels for Python 3.12 and 3.13 but not yet 3.14
    "endplay>=0.5; python_version < '3.14'",
]
notebooks = [
    "notebook>=7",
    "pandas>=2",
    "scipy>=1.13",
    "seaborn>=0.13",
    "matplotlib>=3.9",
    "nbstripout>=0.8",
    "pymc>=6.4.0",
    "arviz>=1.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["Bridge"]

[tool.uv]
default-groups = ["dev", "dd", "notebooks"]

[tool.pytest.ini_options]
testpaths = ["Bridge"]
filterwarnings = ["error"]
