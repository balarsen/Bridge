name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}  # overrides the .python-version pin
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install (package, test and double-dummy dependencies, not the notebook stack)
        # the dd group (endplay) has wheels for Python 3.12 and 3.13 only; on 3.14 it is skipped by its marker
        # and the double-dummy tests skip themselves
        run: uv sync --no-default-groups --group dev --group dd
      - name: Test with coverage
        run: uv run --no-sync pytest --cov=Bridge --cov-report=term-missing
